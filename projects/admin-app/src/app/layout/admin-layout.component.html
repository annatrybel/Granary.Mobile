<div class="min-h-screen bg-[#FAF9F5] text-neutral-900 flex antialiased">
  
  <aside 
    class="bg-white border-r border-neutral-200/80 min-h-screen flex flex-col justify-between shrink-0 sticky top-0 h-screen select-none z-20 transition-all duration-300 ease-in-out relative"
    [ngClass]="isCollapsed() ? 'w-20' : 'w-64'">
    
    <button 
      type="button"
      (click)="toggleSidebar()"
      [title]="isCollapsed() ? 'Rozwiń menu' : 'Zwiń menu'"
      class="absolute -right-3.5 top-1/2 -translate-y-1/2 w-7 h-7 bg-white border border-neutral-300 rounded-full shadow-sm flex items-center justify-center text-neutral-500 hover:text-neutral-900 hover:border-neutral-400 transition-all cursor-pointer z-30 active:scale-95">
      @if (isCollapsed()) {
        <svg lucideChevronRight [size]="14"></svg>
      } @else {
        <svg lucideChevronLeft [size]="14"></svg>
      }
    </button>

    <div class="p-4 flex flex-col gap-6">
      
      <div class="flex items-center pb-3 border-b border-neutral-100 min-h-[48px]" [ngClass]="isCollapsed() ? 'justify-center' : 'justify-start'">
        @if (!isCollapsed()) {
          <div class="flex items-center gap-3 overflow-hidden">
            <div class="w-10 h-10 rounded-xl bg-[#536500] text-white flex items-center justify-center shadow-md shadow-[#536500]/20 shrink-0">
              <svg lucideSprout [size]="22"></svg>
            </div>
            <div class="flex flex-col min-w-0">
              <span class="text-base font-extrabold tracking-tight text-neutral-900 leading-none truncate">Smart Pantry</span>
              <span class="text-[10px] font-bold text-neutral-400 uppercase tracking-widest mt-1">Console</span>
            </div>
          </div>
        } @else {
          <div class="w-10 h-10 rounded-xl bg-[#536500] text-white flex items-center justify-center shadow-md shadow-[#536500]/20 shrink-0">
            <svg lucideSprout [size]="22"></svg>
          </div>
        }
      </div>

      <!-- Menu Nawigacji -->
      <nav class="flex flex-col gap-1.5" aria-label="Nawigacja główna">
        <a routerLink="/admin/users" 
           routerLinkActive="bg-[#536500] text-white shadow-md shadow-[#536500]/20 font-bold"
           [title]="isCollapsed() ? 'Użytkownicy' : ''"
           class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100/70 font-semibold text-sm transition-all group"
           [ngClass]="isCollapsed() ? 'justify-center px-0' : ''">
          <svg lucideUsers [size]="18" class="shrink-0"></svg>
          @if (!isCollapsed()) { <span>Użytkownicy</span> }
        </a>

        <a routerLink="/admin/products" 
           routerLinkActive="bg-[#536500] text-white shadow-md shadow-[#536500]/20 font-bold"
           [title]="isCollapsed() ? 'Katalog produktów' : ''"
           class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100/70 font-semibold text-sm transition-all group"
           [ngClass]="isCollapsed() ? 'justify-center px-0' : ''">
          <svg lucidePackage [size]="18" class="shrink-0"></svg>
          @if (!isCollapsed()) { <span>Baza produktów</span> }
        </a>

        <a routerLink="/admin/recipes" 
           routerLinkActive="bg-[#536500] text-white shadow-md shadow-[#536500]/20 font-bold"
           [title]="isCollapsed() ? 'Przepisy' : ''"
           class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100/70 font-semibold text-sm transition-all group"
           [ngClass]="isCollapsed() ? 'justify-center px-0' : ''">
          <svg lucideBookOpen [size]="18" class="shrink-0"></svg>
          @if (!isCollapsed()) { <span>Przepisy</span> }
        </a>
      </nav>
    </div>

    <div class="p-3 border-t border-neutral-200/80 bg-neutral-50/60">
      <div class="flex items-center rounded-xl bg-white border border-neutral-200/70 p-2 shadow-2xs"
           [ngClass]="isCollapsed() ? 'justify-center' : 'justify-between'">
        <div class="flex items-center gap-2.5 min-w-0" [title]="isCollapsed() ? 'Administrator' : ''">
          <div class="w-8 h-8 rounded-lg bg-[#536500]/15 text-[#536500] font-extrabold text-xs flex items-center justify-center shrink-0 border border-[#536500]/20">
            AD
          </div>
          @if (!isCollapsed()) {
            <div class="flex flex-col min-w-0">
              <span class="text-xs font-bold text-neutral-900 truncate">Administrator</span>
              <span class="text-[10px] text-neutral-500 truncate">Zalogowany</span>
            </div>
          }
        </div>

        @if (!isCollapsed()) {
          <button type="button" (click)="logout()" title="Wyloguj się" class="w-7 h-7 rounded-lg text-neutral-400 hover:text-rose-600 hover:bg-rose-50 flex items-center justify-center transition-colors cursor-pointer">
            <svg lucideLogOut [size]="15"></svg>
          </button>
        }
      </div>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white/80 backdrop-blur-md border-b border-neutral-200/80 px-8 flex items-center justify-between sticky top-0 z-10 select-none">
      <div class="flex items-center gap-2 text-xs font-semibold text-neutral-500">
        <span>Panel Administracyjny</span>
        <svg lucideChevronRight [size]="14" class="text-neutral-400"></svg>
        <span class="text-neutral-900 font-bold">Konsola</span>
      </div>
    </header>

    <main class="p-8 flex flex-col gap-6 max-w-7xl mx-auto w-full">
      <router-outlet />
    </main>
  </div>

</div>
