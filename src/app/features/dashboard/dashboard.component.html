<main class="dashboard-page">
  <div class="dashboard-container">

    <app-dashboard-header 
      [userName]="userName()" 
      [expiringCount]="expiringItems().length" />

    <app-dashboard-expiring-carousel 
      [items]="expiringItems()" />

    <app-dashboard-stock-grid 
      [stockSections]="stockSections()" />

    <app-dashboard-recipe-list 
      [recipes]="recipes()" />

  </div>
</main>
