<div class="sheet-backdrop" (click)="closeSheet.emit()"></div>

<div class="sheet-container animate-slide-up">
  
  <div class="sheet-header">
    <div class="sheet-drag-handle"></div>
    <div class="sheet-header-row">
      <h2 class="sheet-title">Filtry i sortowanie</h2>
      <button 
        type="button" 
        class="sheet-close-btn"
        (click)="closeSheet.emit()"
        aria-label="Zamknij">
        ✕
      </button>
    </div>
  </div>

  <div class="sheet-content">
    
    <div class="form-group">
      <div class="flex items-center justify-between">
        <label class="form-label">Dostępność w magazynie</label>
        <span class="bg-neutral-100 text-neutral-600 px-2 py-0.5 rounded text-[10px] font-medium">Główny filtr</span>
      </div>
      <div class="grid grid-cols-3 gap-1 bg-neutral-100 p-1 rounded-xl border border-neutral-200/80">
        <button 
          type="button" 
          [class.active-segment]="availability() === 'ready'"
          [class.inactive-segment]="availability() !== 'ready'"
          (click)="availability.set('ready')">
          100% z magazynu
        </button>
        <button 
          type="button" 
          [class.active-segment]="availability() === 'missing2'"
          [class.inactive-segment]="availability() !== 'missing2'"
          (click)="availability.set('missing2')">
          Brakuje ≤ 2
        </button>
        <button 
          type="button" 
          [class.active-segment]="availability() === 'all'"
          [class.inactive-segment]="availability() !== 'all'"
          (click)="availability.set('all')">
          Wszystkie
        </button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Maksymalny czas</label>
      <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
        <button 
          type="button" 
          class="pill-filter-btn" 
          [class.active]="maxTime() === 15" 
          (click)="maxTime.set(maxTime() === 15 ? null : 15)">
          do 15 min
        </button>
        <button 
          type="button" 
          class="pill-filter-btn" 
          [class.active]="maxTime() === 30" 
          (click)="maxTime.set(maxTime() === 30 ? null : 30)">
          do 30 min
        </button>
        <button 
          type="button" 
          class="pill-filter-btn" 
          [class.active]="maxTime() === 45" 
          (click)="maxTime.set(maxTime() === 45 ? null : 45)">
          do 45 min
        </button>
        <button 
          type="button" 
          class="pill-filter-btn" 
          [class.active]="maxTime() === null" 
          (click)="maxTime.set(null)">
          Dowolny
        </button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Sortuj według</label>
      <div class="grid grid-cols-2 gap-2.5">
        <button 
          type="button" 
          class="sort-card-btn"
          [class.active]="sortBy() === 'match'"
          (click)="sortBy.set('match')">
          <span class="truncate">Dopasowanie spiżarni</span>
          @if (sortBy() === 'match') { <span>✓</span> }
        </button>

        <button 
          type="button" 
          class="sort-card-btn"
          [class.active]="sortBy() === 'time'"
          (click)="sortBy.set('time')">
          <span class="truncate">Najkrótszy czas</span>
          @if (sortBy() === 'time') { <span>✓</span> }
        </button>

        <button 
          type="button" 
          class="sort-card-btn"
          [class.active]="sortBy() === 'calories'"
          (click)="sortBy.set('calories')">
          <span class="truncate">Najmniej kalorii</span>
          @if (sortBy() === 'calories') { <span>✓</span> }
        </button>

        <button 
          type="button" 
          class="sort-card-btn"
          [class.active]="sortBy() === 'rating'"
          (click)="sortBy.set('rating')">
          <span class="truncate">Ocena użytkowników</span>
          @if (sortBy() === 'rating') { <span>✓</span> }
        </button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Posiłek</label>
      <div class="flex flex-wrap gap-2">
        @for (m of ['Śniadanie', 'Obiad', 'Kolacja', 'Przekąska']; track m) {
          <button 
            type="button" 
            class="pill-filter-btn"
            [class.active]="mealType() === m"
            (click)="setMealType(m)">
            {{ m }}
          </button>
        }
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Preferencje i diety</label>
      <div class="flex flex-wrap gap-2">
        @for (d of ['Bez glutenu', 'Bez laktozy', 'Wegańskie', 'Wegetariańskie']; track d) {
          <button 
            type="button" 
            class="pill-filter-btn"
            [class.active]="diet() === d"
            (click)="setDiet(d)">
            {{ d }}
          </button>
        }
      </div>
    </div>

    <div class="sheet-actions-row pt-2">
      <button 
        type="button" 
        class="reset-link-btn" 
        (click)="onReset()">
        Wyczyść filtry
      </button>
      <button 
        type="button" 
        (click)="onApply()"
        class="submit-cta-btn">
        Pokaż przepisy
      </button>
    </div>

  </div>

</div>
