<main class="pt-20 pb-32 min-h-screen bg-surface">
  <div class="flex flex-col w-full gap-4 px-6 py-2">

    <!-- 1. OWALNA WYSZUKIWARKA PRZEPISÓW -->
    <div class="recipe-search-bar">
      <!-- Ikona lupy -->
      <img src="/icons/search.svg" alt="Szukaj" class="w-[18px] h-[18px] shrink-0" />

      <!-- Pole tekstowe -->
      <input 
        type="text" 
        class="search-input-field" 
        placeholder="Szukaj w przepisach..." 
        [value]="searchQuery()"
        (input)="onSearch($event)"
      />

      <!-- Przycisk filtra -->
      <button (click)="toggleFilters()" class="filter-btn-icon cursor-pointer" title="Filtry">
        <img src="/icons/filter.svg" alt="Filtry" class="w-[15px] h-[15px]" />
      </button>
    </div>

    <!-- 2. PASEK TAGÓW / KATEGORII -->
    <div class="recipe-tags-scroll">
      @for (tag of tags; track tag.id) {
        <button 
          class="tag-pill cursor-pointer" 
          [class.active]="selectedTag() === tag.id" 
          (click)="selectTag(tag.id)"
        >
          {{ tag.name }}
        </button>
      }
    </div>

    <!-- 3. LISTA PRZEPISÓW -->
    <div class="flex flex-col gap-4 mt-1">
      @for (recipe of filteredRecipes(); track recipe.id) {
        <div class="flex flex-col p-4 bg-white rounded-3xl shadow-[0_4px_20px_0_rgba(26,26,26,0.10)] gap-3 cursor-pointer transition-transform active:scale-[0.99]" (click)="openRecipe(recipe.id)">
          
          <div class="flex items-center justify-between">
            <span class="text-3xl p-3 bg-surface rounded-2xl">{{ recipe.emoji }}</span>
            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-[#EAE7E7] text-on-surface">
              ⏱️ {{ recipe.time }}
            </span>
          </div>

          <div class="flex flex-col gap-1">
            <h3 class="text-on-surface font-bold text-lg leading-snug">{{ recipe.title }}</h3>
            <p class="text-muted text-xs font-medium">{{ recipe.description }}</p>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-[#F0EDED]">
            <span class="text-xs font-bold text-primary">
              {{ recipe.matchCount }} składniki z Twoich zapasów
            </span>
          </div>

        </div>
      } @empty {
        <div class="text-center py-12 text-muted font-medium">
          Nie znaleziono przepisów spełniających kryteria.
        </div>
      }
    </div>

  </div>
</main>
