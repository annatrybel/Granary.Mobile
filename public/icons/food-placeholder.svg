<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Miękkie, ciepłe tło zgodne z Figmą -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F2EFEA" />
    </linearGradient>

    <!-- Subtelny akcent oliwkowo-zielony Zero-Waste -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#657B00" />
      <stop offset="100%" stop-color="#536500" />
    </linearGradient>

    <!-- Cień pod naczyniem -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#536500" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Karta tła o zaokrąglonych rogach -->
  <rect width="160" height="160" rx="36" fill="url(#bgGrad)" />

  <!-- Dysk talerza bazowego -->
  <g filter="url(#softShadow)">
    <!-- Zewnętrzny obrys talerza -->
    <ellipse cx="80" cy="104" rx="46" ry="14" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="2.5" />
    <!-- Zagłębienie talerza -->
    <ellipse cx="80" cy="103" rx="34" ry="9" fill="#F4F1EC" stroke="#DBD7CE" stroke-width="1.5" />
  </g>

  <!-- Klosz / Pokrywa dania (Przepisy i gotowanie) -->
  <path d="M42 98 C42 66, 60 56, 80 56 C100 56, 118 66, 118 98 Z" 
        fill="#FFFFFF" 
        stroke="#536500" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Subtelne przetłoczenie / blik na kloszu -->
  <path d="M54 94 C54 74, 66 65, 80 65" 
        stroke="#E5E2DC" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Uchwyt klosza -->
  <circle cx="80" cy="52" r="5" fill="#536500" />
  <path d="M80 57 V60" stroke="#536500" stroke-width="3" stroke-linecap="round" />

  <!-- Listek Zero-Waste / Świeżości (Kategorie i spiżarnia) -->
  <g transform="translate(90, 36) rotate(18)">
    <path d="M0 16 C-2 8, 4 1, 14 0 C15 10, 8 16, 0 16 Z" 
          fill="url(#leafGrad)" />
    <path d="M1 15 C5 10, 9 6, 13 1" 
          stroke="#FAF8F5" 
          stroke-width="1.2" 
          stroke-linecap="round" 
          opacity="0.8" />
  </g>

  <!-- Drobne iskierki świeżości / smaku -->
  <circle cx="44" cy="50" r="2" fill="#536500" opacity="0.3" />
  <circle cx="120" cy="58" r="1.5" fill="#536500" opacity="0.3" />
</svg>